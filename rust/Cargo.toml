# The Rust modules: ported from common, built as one static library with C names (rdof_rust).
# One library per firmware image: each Rust staticlib carries its own copy of core and a panic handler.
[package]
name = "rdof_rust"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT AND ISC"

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
codegen-units = 1
lto = true
debug = true
